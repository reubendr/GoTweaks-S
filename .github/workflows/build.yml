name: Build GoTweaks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore NuGet packages
        run: nuget restore XboxGamingBar.sln
      
      - name: Build solution (Release x64)
        run: >
          msbuild XboxGamingBar.sln
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxPackageDir=D:\\AppPackages\
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:GenerateAppxPackageOnBuild=true
          /restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoTweaks-Release-x64
          path: |
            D:\\AppPackages\**
            XboxGamingBar\\AppPackages\**
            XboxGamingBarPackage\\AppPackages\**
          if-no-files-found: warn
