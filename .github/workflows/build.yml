name: Build GoTweaks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Restore NuGet packages
        run: |
          nuget restore XboxGamingBar.sln
        continue-on-error: true

      - name: Build app package (Release x64)
        run: >
          msbuild XboxGamingBarPackage\XboxGamingBarPackage.wapproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:AppxPackageDir=D:\AppPackages\
          /p:AppxBundle=Never
          /p:AppxPackageSigningEnabled=true
          /p:UapAppxPackageBuildMode=SideloadOnly
          /p:GenerateAppxPackageOnBuild=true
          /restore
          /m

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoTweaks-Release-x64
          path: |
            D:\AppPackages\**
            XboxGamingBarPackage\AppPackages\**
          if-no-files-found: warn
